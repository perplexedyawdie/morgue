; Morgue runtime config for PHP 8.4.
;
; E_DEPRECATED is excluded ONLY because of vendor slim/slim 2.6.3 (abandoned, no PHP 8
; release). Slim::run() installs Slim::handleErrors(), which turns every level enabled in
; error_reporting into an ErrorException. With E_ALL, its own PHP 8.1+ deprecations
; (ArrayAccess/Countable/IteratorAggregate methods without return types or
; #[\ReturnTypeWillChange]; session_set_save_handler() with callables, 8.4) become fatal.
; The accepted list is in docs/php84-spike/JOURNAL.md. App-code deprecations are fixed in the
; code, and phpunit + the static scan still run at E_ALL. Remove this line when Slim 2 goes.
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
log_errors = On
